[package]
name = "krill"
version = "0.1.0"
edition = "2021"
description = "CLI for the TinyFish web automation API"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-stream = "0.3"
futures-util = "0.3"
colored = "2"
